
<!DOCTYPE html>
<html>
<head>
    <title>3 Circle Animation</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }

        .container {
            display: flex;
            gap: 20px;
        }

        .circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            animation: bounce 1s infinite alternate ease-in-out;
        }

        .circle:nth-child(1) {
            background: #ff4757;
            animation-delay: 0s;
        }

        .circle:nth-child(2) {
            background: #2ed573;
            animation-delay: 0.3s;
        }

        .circle:nth-child(3) {
            background: #1e90ff;
            animation-delay: 0.6s;
        }

        @keyframes bounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-100px);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

</body>
</html>
