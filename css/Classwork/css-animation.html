<!DOCTYPE html>
<html>
<head>
<style> 
div {
  width: 100px;
  height: 100px;
  background-color: red;
  animation-name: A1;
  animation-duration: 4s;
}

@keyframes A1 {
  from {background-color: #1D4350;}
  to {background-color: #EF629F;}
}
</style>
</head>
<body>

<h1>CSS Animation</h1>

<div>css</div>

<p><b>Note:</b> When an animation is finished, it goes back to its original style.</p>

</body>
</html>
