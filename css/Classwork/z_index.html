<!DOCTYPE html>
<html>
<head>
<style>
img {
  position: absolute;
  left: 0px;
  top: 0px;
  z-index: -1;
  width: 50%;
  height: 50%;
}
</style>
</head>
<body>

<h1>This is a heading</h1>
<img src="tree.png" alt="image not found">
<p>Because the image has a z-index of -1, it will be placed behind the text.</p>

</body>
</html>
